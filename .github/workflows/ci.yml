name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # OTP 27.1's TLS stack cannot install Rebar from builds.hex.pm; the
          # 27.3 patch is the practical CI floor for this action.
          - elixir: "1.18"
            otp: "27.3"
          - elixir: "1.20"
            otp: "29"

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: MIX_ENV=dev mix deps.get
      - run: mix ci
      - name: Run tests with coverage
        run: mix coveralls.html
      - name: Generate coverage JSON
        if: matrix.elixir == '1.20'
        run: mix coveralls.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.elixir }}-${{ matrix.otp }}
          path: cover/
          retention-days: 30
      - name: Post coverage to Codecov
        if: matrix.elixir == '1.20'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::notice::CODECOV_TOKEN not set - skipping Codecov upload."
            exit 0
          fi
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov --token "$CODECOV_TOKEN" --file cover/excoveralls.json
        continue-on-error: true
      - run: MIX_ENV=dev mix docs --warnings-as-errors
