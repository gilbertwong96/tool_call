name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # OTP 27.1's TLS stack cannot install Rebar from builds.hex.pm; the
          # 27.3 patch is the practical CI floor for this action.
          - elixir: "1.18"
            otp: "27.3"
          - elixir: "1.20"
            otp: "29"

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-

      - run: mix deps.get
      - run: MIX_ENV=dev mix deps.get
      - run: mix ci
      - run: mix test --cover > /tmp/cover.out
      - run: grep -q '100.00% | Total' /tmp/cover.out
      - run: MIX_ENV=dev mix docs --warnings-as-errors
